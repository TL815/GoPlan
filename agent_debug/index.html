<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GoPlan Agent Debug</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #f7f8f7;
        color: #151515;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(1180px, calc(100vw - 24px));
        margin: 0 auto;
        padding: 24px 0 34px;
      }
      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0;
        font-size: 26px;
        line-height: 1.1;
        letter-spacing: 0;
      }
      .subtitle {
        margin-top: 8px;
        color: #747b78;
        font-size: 13px;
        font-weight: 700;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 0 10px;
        border-radius: 999px;
        background: #f0f5f2;
        color: #435149;
        font-size: 12px;
        font-weight: 900;
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(320px, 0.82fr) minmax(0, 1.18fr);
        gap: 16px;
        align-items: start;
      }
      .panel {
        min-width: 0;
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 8px 22px rgb(0 0 0 / 7%);
      }
      .chat {
        min-width: 0;
        min-height: 720px;
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
      }
      .chat-head, .section-head {
        padding: 16px 18px;
        border-bottom: 1px solid #eef0ef;
      }
      h2 {
        margin: 0;
        font-size: 16px;
        letter-spacing: 0;
      }
      .messages {
        min-width: 0;
        padding: 16px;
        overflow: auto;
        max-height: 560px;
      }
      .message {
        display: flex;
        margin-bottom: 12px;
      }
      .message.user { justify-content: flex-end; }
      .bubble {
        max-width: 82%;
        padding: 12px 13px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.45;
        font-weight: 700;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .assistant .bubble {
        background: #f2f4f3;
        color: #202523;
      }
      .user .bubble {
        background: #111;
        color: #fff;
      }
      .composer {
        padding: 14px;
        border-top: 1px solid #eef0ef;
      }
      textarea {
        width: 100%;
        min-height: 76px;
        resize: vertical;
        border: 0;
        outline: 0;
        border-radius: 14px;
        background: #f2f4f3;
        padding: 13px 14px;
        font-size: 14px;
        line-height: 1.5;
        color: #151515;
        font: inherit;
      }
      .composer-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 10px;
      }
      .hint, .status {
        min-width: 0;
        color: #8a908d;
        font-size: 12px;
        font-weight: 800;
        overflow-wrap: anywhere;
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 11px 17px;
        background: #111;
        color: #fff;
        font-weight: 900;
        white-space: nowrap;
        cursor: pointer;
      }
      button.secondary {
        background: #edf1ef;
        color: #435149;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .right {
        min-width: 0;
        display: grid;
        gap: 16px;
      }
      .section-body {
        min-width: 0;
        padding: 16px;
      }
      .day {
        min-width: 0;
        background: #fff;
        border: 1px solid #eef0ef;
        border-radius: 16px;
        padding: 14px;
        margin-bottom: 10px;
      }
      .day-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }
      .stop {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
        gap: 10px;
        padding: 10px 0;
        border-top: 1px solid #f0f1f0;
      }
      .index {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #111;
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 900;
      }
      .stop-name {
        font-size: 14px;
        font-weight: 900;
        overflow-wrap: anywhere;
      }
      .stop-meta, .stop-reason {
        margin-top: 4px;
        color: #737b77;
        font-size: 12px;
        line-height: 1.35;
        font-weight: 650;
      }
      pre {
        width: 100%;
        margin: 0;
        max-height: 420px;
        overflow: auto;
        border-radius: 14px;
        background: #111;
        color: #e8eee9;
        padding: 14px;
        font-size: 12px;
        line-height: 1.45;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }
      @media (max-width: 980px) {
        .grid { grid-template-columns: 1fr; }
        .chat { min-height: 620px; }
      }
      @media (max-width: 560px) {
        main {
          width: min(100vw - 16px, 1180px);
          padding-top: 16px;
        }
        header {
          align-items: flex-start;
          flex-direction: column;
        }
        .composer-actions {
          align-items: stretch;
          flex-direction: column;
        }
        button { width: 100%; }
        .bubble { max-width: 94%; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>GoPlan Agent Debug</h1>
          <div class="subtitle">&#x4e00;&#x95ee;&#x4e00;&#x7b54;&#x5730;&#x8c03;&#x6574;&#x884c;&#x7a0b;&#xff0c;&#x53f3;&#x4fa7;&#x5b9e;&#x65f6;&#x770b;&#x7ed3;&#x6784;&#x5316;&#x8ba1;&#x5212;&#x3002;</div>
        </div>
        <span class="badge">chat-agent-v0</span>
      </header>

      <div class="grid">
        <section class="panel chat">
          <div class="chat-head">
            <h2>Agent &#x5bf9;&#x8bdd;</h2>
            <div class="chips">
              <button class="secondary" id="sample1">&#x676d;&#x5dde;&#x60c5;&#x4fa3;&#x6e38;</button>
              <button class="secondary" id="sample2">&#x5c11;&#x4e00;&#x70b9;&#x5496;&#x5561;</button>
              <button class="secondary" id="sample3">&#x52a0;&#x535a;&#x7269;&#x9986;</button>
            </div>
          </div>
          <div class="messages" id="messages"></div>
          <div class="composer">
            <textarea id="input"></textarea>
            <div class="composer-actions">
              <div class="hint" id="hint">&#x652f;&#x6301;&#x8fde;&#x7eed;&#x8bf4;&#xff1a;&#x5220;&#x6389;&#x5496;&#x5561;&#x3001;&#x52a0;&#x535a;&#x7269;&#x9986;&#x3001;&#x5c11;&#x8d70;&#x8def;&#x3002;</div>
              <button id="send">&#x53d1;&#x9001;</button>
            </div>
          </div>
        </section>

        <div class="right">
          <section class="panel">
            <div class="section-head">
              <h2>&#x7ed3;&#x6784;&#x5316;&#x884c;&#x7a0b;</h2>
              <div class="status" id="status"></div>
            </div>
            <div class="section-body" id="plan"></div>
          </section>
          <section class="panel">
            <div class="section-head">
              <h2>JSON</h2>
            </div>
            <div class="section-body">
              <pre id="json">{}</pre>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script>
      const messagesEl = document.querySelector("#messages");
      const inputEl = document.querySelector("#input");
      const sendEl = document.querySelector("#send");
      const statusEl = document.querySelector("#status");
      const planEl = document.querySelector("#plan");
      const jsonEl = document.querySelector("#json");

      let history = [];
      let previousPlan = null;

      const samples = {
        sample1: "\u5e2e\u6211\u89c4\u5212\u676d\u5dde 2 \u5929\u60c5\u4fa3\u6e38\uff0c\u60f3\u8981\u897f\u6e56\u3001\u5496\u5561\u3001\u8f7b\u677e\u62cd\u7167\uff0c\u4e0d\u8981\u592a\u7d2f\u3002",
        sample2: "\u5496\u5561\u5c11\u4e00\u70b9\uff0c\u591a\u4e00\u70b9\u6f2b\u6b65\u548c\u62cd\u7167\u3002",
        sample3: "\u52a0\u4e00\u4e2a\u535a\u7269\u9986\uff0c\u6574\u4f53\u5c11\u8d70\u8def\u3002",
      };

      inputEl.value = samples.sample1;
      addMessage(
        "assistant",
        "\u6211\u662f GoPlan Agent\u3002\u4f60\u53ef\u4ee5\u5148\u8bf4\u4e00\u4e2a\u884c\u7a0b\u9700\u6c42\uff0c\u7136\u540e\u7ee7\u7eed\u8bf4\u201c\u5c11\u4e00\u70b9\u5496\u5561\u201d\u3001\u201c\u52a0\u535a\u7269\u9986\u201d\u3001\u201c\u5c11\u8d70\u8def\u201d\u6765\u8c03\u6574\u3002",
      );

      sendEl.addEventListener("click", sendMessage);
      inputEl.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) sendMessage();
      });
      for (const [id, value] of Object.entries(samples)) {
        document.querySelector(`#${id}`).addEventListener("click", () => {
          inputEl.value = value;
          inputEl.focus();
        });
      }

      async function sendMessage() {
        const message = inputEl.value.trim();
        if (!message) return;
        inputEl.value = "";
        addMessage("user", message);
        history.push({ role: "user", content: message });
        sendEl.disabled = true;
        statusEl.textContent = "\u6b63\u5728\u8c03\u7528 Agent...";
        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "content-type": "application/json; charset=utf-8" },
            body: JSON.stringify({ message, history, previousPlan }),
          });
          const data = await response.json();
          jsonEl.textContent = JSON.stringify(data, null, 2);
          if (!data.ok) throw new Error(data.error || "Agent failed");
          previousPlan = data.plan;
          history.push({ role: "assistant", content: data.reply });
          addMessage("assistant", data.reply);
          renderPlan(data.plan);
          statusEl.textContent = "\u5df2\u6839\u636e\u5bf9\u8bdd\u66f4\u65b0";
        } catch (error) {
          const text = `\u8fd0\u884c\u5931\u8d25\uff1a${error.message}`;
          addMessage("assistant", text);
          statusEl.textContent = text;
        } finally {
          sendEl.disabled = false;
        }
      }

      function addMessage(role, content) {
        const item = document.createElement("div");
        item.className = `message ${role}`;
        item.innerHTML = `<div class="bubble">${escapeHtml(content)}</div>`;
        messagesEl.appendChild(item);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function renderPlan(data) {
        planEl.innerHTML = "";
        for (const day of data.days || []) {
          const card = document.createElement("article");
          card.className = "day";
          card.innerHTML = `
            <div class="day-title">
              <strong>Day ${day.day}</strong>
              <span class="badge">${escapeHtml(day.theme || "")}</span>
            </div>
          `;
          for (const stop of day.stops || []) {
            const row = document.createElement("div");
            row.className = "stop";
            row.innerHTML = `
              <div class="index">${stop.order}</div>
              <div>
                <div class="stop-name">${escapeHtml(stop.name)}</div>
                <div class="stop-meta">${escapeHtml(stop.address || stop.district || "")}</div>
                <div class="stop-reason">${escapeHtml(stop.reason || "")}</div>
              </div>
            `;
            card.appendChild(row);
          }
          planEl.appendChild(card);
        }
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
    </script>
  </body>
</html>
