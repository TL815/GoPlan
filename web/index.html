<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GoPlan AI 旅行规划 Web 预览版。">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GoPlan">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GoPlan</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // 高德 Web JS API 配置。
    // 1. 在高德开放平台申请 Web 端 JS API Key 后，替换 YOUR_AMAP_WEB_KEY。
    // 2. 2021-12-02 后申请的 Key 通常需要 securityJsCode。
    // 3. 生产环境建议用安全代理服务转发 securityJsCode，不要直接暴露真实安全密钥。
    window.goplanAmapConfig = {
      key: 'YOUR_AMAP_WEB_KEY',
      securityJsCode: '',
      serviceHost: ''
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then((registrations) => registrations.forEach((registration) => registration.unregister()));
    }
    if ('caches' in window) {
      caches.keys().then((keys) => keys.forEach((key) => caches.delete(key)));
    }
  </script>
  <script src="flutter_bootstrap.js?v=figma-nav-icons" async></script>
</body>
</html>
